name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Build backend wheel
        run: uv build --wheel

      - name: Verify wheel API outside checkout with isolated data
        run: uv run python ../scripts/check_backend_wheel.py dist/gabi-0.1.0-py3-none-any.whl

      - name: Check backend architecture and legacy debt
        run: uv run python ../scripts/check_architecture.py --baseline-base HEAD^

      - name: Verify frozen research engines
        run: uv run python -m gabi.frozen_research_ci --check-frozen

      - name: Verify published search ledger
        run: uv run python -m gabi.search_ledger --verify

      - name: Lint (ruff)
        run: uv run ruff check ..

      - name: Type check (mypy)
        run: uv run python -m gabi.frozen_research_ci --typecheck

      # Los módulos del backend no abren bases ni arrancan workers al importar.
      - name: Import smoke test (backend packages)
        run: |
          uv run python -c "
          import pkgutil, importlib, importlib.util
          count = 0
          for name in ('gabi', 'gabi_api', 'gabi_cli'):
              if importlib.util.find_spec(name) is None:
                  continue
              package = importlib.import_module(name)
              for m in pkgutil.walk_packages(package.__path__, prefix=name + '.'):
                  importlib.import_module(m.name)
                  count += 1
          print(f'{count} módulos importados OK')
          "

      - name: Tests (pytest)
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install test backend (locked, isolated at runtime)
        run: uv sync --project ../backend --locked --all-groups
      - name: Install frontend dependencies (locked)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check OpenAPI snapshot and generated types
        run: npm run check:api
      - name: Lint and architecture
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Test architecture rules
        run: npm run test:architecture
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows against temporary test backend
        run: npm run test:e2e
      - name: Keep browser report, screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
