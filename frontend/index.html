<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183e32" />
    <meta
      name="description"
      content="GABI: tu espacio local para analizar empresas y revisar la evidencia."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>GABI</title>
    <script>
      // Theme before the first paint (#321): the saved choice or, by default, the system's.
      // Same rule as src/shared/lib/theme.ts; storage may be blocked, so it never throws.
      (function () {
        var choice = 'system';
        try {
          choice = localStorage.getItem('gabi-theme') || 'system';
        } catch (error) {}
        var dark =
          choice === 'dark' ||
          (choice !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
