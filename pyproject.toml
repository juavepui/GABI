[project]
name = "gabi"
version = "0.1.0"
description = "Screener de acciones (fundamentales + momentum) — uso personal y educativo"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.38",
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.24",
    "plotly>=5.20",
    "lxml>=5.0",
    "requests>=2.31",
    "quantstats>=0.0.81",
    "pyportfolioopt>=1.6.0",
    "backtesting>=0.6.6",
    "exchange_calendars>=4.13,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gabi"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # el estilo existente usa líneas largas (docstrings, literales); ruff format ya se encarga del resto

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false  # el código existente usa `x: str = None` por todas partes; migrarlo es aparte
exclude = ["^tests/", "^app/"]

[[tool.mypy.overrides]]
# Deuda de tipos preexistente que toca lógica de negocio (Optional implícitos
# reales, mezclas float/None, listas vs ndarray) -- deliberadamente fuera de
# alcance de la migración a pyproject/CI para no tocar cálculos financieros
# a ciegas. Quitar de esta lista según se vayan tipando módulo a módulo.
module = [
    "gabi.storage",
    "gabi.data_fetch",
    "gabi.macro",
    "gabi.edgar",
    "gabi.technicals",
    "gabi.stats_rigor",
    "gabi.insider",
    "gabi.multifactor_backtest",
    "gabi.blind_validation",
    "gabi.decision_engine",
    "gabi.portfolio_lab",
    "gabi.factor_lab",
    "gabi.sim_portfolios",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
